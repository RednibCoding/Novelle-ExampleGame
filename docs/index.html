<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novelle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 24px;
        }
    </style>
    <script src="wasm_exec.js"></script>
</head>
<body>
    <div id="loading">Loading...</div>
    <script>
        const go = new Go();
        
        WebAssembly.instantiateStreaming(fetch("novelle.wasm"), go.importObject)
            .then(result => {
                document.getElementById("loading").style.display = "none";
                go.run(result.instance);
            })
            .catch(err => {
                document.getElementById("loading").textContent = "Error loading game: " + err;
                console.error(err);
            });
    </script>
</body>
</html>
