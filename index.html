<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novelle</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        
        // Fetch and decompress gzipped WASM
        fetch("novelle.wasm.gz")
            .then(response => response.body.pipeThrough(new DecompressionStream("gzip")))
            .then(stream => new Response(stream))
            .then(response => WebAssembly.instantiateStreaming(response, go.importObject))
            .then(result => go.run(result.instance))
            .catch(err => {
                console.error("Failed to load compressed WASM, trying uncompressed:", err);
                // Fallback to uncompressed version
                WebAssembly.instantiateStreaming(fetch("novelle.wasm"), go.importObject)
                    .then(result => go.run(result.instance));
            });
    </script>
</body>
</html>
